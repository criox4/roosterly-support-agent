<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roosterly Support Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600;700&family=Public+Sans:wght@400;600;700&display=swap">
<style>
  /* Theme: shadcn preset b2h47HD7kv ("base-sera", mist), tokens copied from `shadcn init -p b2h47HD7kv` */
  :root {
    --background: oklch(1 0 0); --foreground: oklch(0.148 0.004 228.8);
    --card: oklch(1 0 0); --primary: oklch(0.218 0.008 223.9); --primary-foreground: oklch(0.987 0.002 197.1);
    --muted: oklch(0.963 0.002 197.1); --muted-foreground: oklch(0.56 0.021 213.5);
    --border: oklch(0.925 0.005 214.3); --ring: oklch(0.723 0.014 214.4); --sidebar: oklch(0.987 0.002 197.1);
    --destructive: oklch(0.577 0.245 27.325); --radius: 0.625rem;
    --reply: oklch(0.52 0.13 150); --handoff: oklch(0.6 0.16 50); --close: var(--muted-foreground);
    --font-serif: "Noto Serif", serif; --font-heading: "Public Sans", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    /* aliases used below */
    --bg: var(--background); --panel: var(--card); --text: var(--foreground); --line: var(--border);
    --accent: var(--primary); --chip: var(--muted); --warn: var(--destructive);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: oklch(0.148 0.004 228.8); --foreground: oklch(0.987 0.002 197.1);
      --card: oklch(0.218 0.008 223.9); --primary: oklch(0.925 0.005 214.3); --primary-foreground: oklch(0.218 0.008 223.9);
      --muted: oklch(0.275 0.011 216.9); --muted-foreground: oklch(0.723 0.014 214.4);
      --border: oklch(1 0 0 / 10%); --ring: oklch(0.56 0.021 213.5); --sidebar: oklch(0.218 0.008 223.9);
      --destructive: oklch(0.704 0.191 22.216);
      --reply: oklch(0.72 0.15 150); --handoff: oklch(0.75 0.15 55);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.6 var(--font-serif); background: var(--bg); color: var(--text); }
  h1, h2, .tabs button, .badge, .chip, button.act, label, th, .item .top, .stat { font-family: var(--font-heading); }
  header { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0; }
  .stat { color: var(--muted-foreground); font-size: 13px; }
  .stat b { color: var(--text); }
  main { display: grid; grid-template-columns: 340px 1fr; height: calc(100vh - 53px); }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; height: auto; } }
  aside { border-right: 1px solid var(--line); overflow: auto; background: var(--sidebar); }
  .tabs { display: flex; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--sidebar); }
  .tabs button { flex: 1; padding: 12px 6px; border: 0; background: none; color: var(--muted-foreground); cursor: pointer; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; border-bottom: 2px solid transparent; }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  .item { padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:hover, .item.on { background: var(--chip); }
  .item .top { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted-foreground); }
  .item .subj { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  section { overflow: auto; padding: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; }
  .card h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted-foreground); margin: 0 0 10px; }
  .body { white-space: pre-wrap; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip { background: var(--chip); border-radius: calc(var(--radius) * 0.6); padding: 2px 10px; font-size: 12px; }
  .badge { border-radius: 0; padding: 4px 12px; font-weight: 600; letter-spacing: .1em; color: var(--primary-foreground); text-transform: uppercase; font-size: 11px; }
  .reply { background: var(--reply); } .handoff { background: var(--handoff); } .close { background: var(--close); }
  .warn { color: var(--warn); }
  .muted { color: var(--muted-foreground); }
  button.act { height: 40px; padding: 0 24px; border-radius: 0; border: 1px solid var(--line); background: transparent; color: var(--text); cursor: pointer; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
  button.act:hover { background: var(--muted); }
  button.act:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
  button.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
  button.primary:hover { background: color-mix(in oklch, var(--primary) 80%, transparent); }
  button:disabled { opacity: .5; cursor: wait; }
  .path { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-family: var(--mono); font-size: 12px; }
  .path span.node { background: var(--chip); padding: 3px 8px; border-radius: 6px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 1100px) { .grid2 { grid-template-columns: 1fr; } }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  td, th { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); }
  input, textarea, select { width: 100%; font: inherit; padding: 8px 10px; border-radius: 0; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--ring); outline-offset: -1px; }
  textarea { min-height: 120px; }
  :root { color-scheme: light dark; }
  select { appearance: none; -webkit-appearance: none; cursor: pointer; padding-right: 32px; height: 38px; }
  .sel { position: relative; }
  .sel::after { content: ""; position: absolute; right: 12px; top: 50%; width: 6px; height: 6px; margin-top: -5px;
    border-right: 1.5px solid var(--muted-foreground); border-bottom: 1.5px solid var(--muted-foreground);
    transform: rotate(45deg); pointer-events: none; }
  select option { background: var(--panel); color: var(--text); }
  label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted-foreground); margin: 10px 0 4px; }
  .label-cmp td:last-child { font-weight: 600; }
  .ok { color: var(--reply); } .miss { color: var(--warn); }
</style>
</head>
<body>
<header>
  <h1>Roosterly support agent</h1>
  <span class="stat" id="model"></span>
  <span class="stat" id="hd"></span>
  <span class="stat" id="ev"></span>
</header>
<main>
  <aside>
    <div class="tabs">
      <button data-tab="tickets" class="on">Tickets</button>
      <button data-tab="examples">Examples</button>
      <button data-tab="custom">New ticket</button>
    </div>
    <div id="list"></div>
  </aside>
  <section id="detail"><p class="muted">Pick a ticket, an example, or write a new ticket.</p></section>
</main>

<script>
const $ = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "on") for (const [ev, fn] of Object.entries(v)) el.addEventListener(ev, fn);
    else if (k === "cls") el.className = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return el;  // all text goes in as text nodes: ticket content can never inject HTML
};
const api = async (path, body) => {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const data = await r.json();
  if (!r.ok || data.error) throw new Error(data.error || r.statusText);
  return data;
};
const card = (title, ...kids) => $("div", { cls: "card" }, $("h2", {}, title), ...kids);

let tab = "tickets", cache = {}, selected = null;
// the ticket list returns handled as "reply", a single ticket as {action, at}
const handledAction = h => (typeof h === "string" ? h : h && h.action);

async function loadStatus() {
  try {
    const s = await api("/api/status");
    document.getElementById("model").replaceChildren("Model ", $("b", {}, s.model));
    document.getElementById("hd").replaceChildren("Helpdesk ", $("b", {}, `${s.open_tickets} open · ${s.handled_tickets} handled`), ` (${s.mode})`);
    const e = s.evals.at(-1);
    if (e) document.getElementById("ev").replaceChildren("Eval ", $("b", {}, `${e.tag}: unsafe ${e.unsafe} · action ${e.accuracy.action} · over-escalated ${e.over_escalated}/${e.examples * e.runs}`));
  } catch (err) { document.getElementById("hd").textContent = "Helpdesk unreachable: " + err.message; }
}

async function showTab(name) {
  tab = name;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === name));
  const list = document.getElementById("list");
  if (name === "custom") { list.replaceChildren($("p", { cls: "muted", style: "padding:14px" }, "Write any ticket on the right. It runs as a dry run: nothing is posted.")); return showCustom(); }
  list.replaceChildren($("p", { cls: "muted", style: "padding:14px" }, "Loading…"));
  try {
    cache[name] = await api(name === "tickets" ? "/api/tickets" : "/api/examples");
  } catch (err) { list.replaceChildren($("p", { cls: "warn", style: "padding:14px" }, err.message)); return; }
  list.replaceChildren(...cache[name].map(t => $("div", { cls: "item", on: { click: () => select(t) } },
    $("div", { cls: "top" }, $("span", {}, `${t.id} · ${t.channel} · ${t.customer_plan}`),
      $("span", {}, t.label ? t.label.action : (t.handled ? `handled: ${handledAction(t.handled)}` : "open"))),
    $("div", { cls: "subj" }, t.subject || "(no subject)"))));
}

function ticketCard(t) {
  return card(`${t.id} · ${t.channel} · plan ${t.customer_plan}`,
    $("div", { style: "font-weight:600;margin-bottom:6px" }, t.subject || "(no subject)"),
    $("div", { cls: "body" }, t.body || "(empty body)"),
    t.handled ? $("p", { cls: "muted" }, `Already handled in the helpdesk: ${handledAction(t.handled)}`) : null);
}

function select(t) {
  selected = t;
  document.querySelectorAll(".item").forEach(el => el.classList.toggle("on", el.querySelector(".top span").textContent.startsWith(t.id + " ")));
  const isTicket = !t.label;
  const out = $("div");
  const decideBtn = $("button", { cls: "act primary", on: { click: () => run(t, false, out, [decideBtn, postBtn]) } }, "Decide (dry run)");
  const postBtn = isTicket ? $("button", { cls: "act", on: { click: () => {
    if (confirm(`Post the agent's decision for ${t.id} to the helpdesk? A customer gets at most one answer.`)) run(t, true, out, [decideBtn, postBtn]);
  } } }, "Decide & post") : null;
  document.getElementById("detail").replaceChildren(ticketCard(t), $("div", { cls: "row", style: "margin-bottom:14px" }, decideBtn, postBtn), out);
}

function showCustom() {
  const subject = $("input", { value: "Vraag over facturen" });
  const body = $("textarea", {}, "Hoi, waar kan ik onze facturen downloaden? Groet, Sam");
  const plan = $("select", {}, $("option", {}, "Basis"), $("option", {}, "Plus"));
  const channel = $("select", {}, $("option", {}, "email"), $("option", {}, "chat"), $("option", {}, "form"));
  const out = $("div");
  const btn = $("button", { cls: "act primary", style: "margin-top:12px", on: { click: () =>
    run({ subject: subject.value, body: body.value, customer_plan: plan.value, channel: channel.value }, false, out, [btn]) } }, "Decide (dry run)");
  document.getElementById("detail").replaceChildren(
    card("New ticket", $("label", {}, "Subject"), subject, $("label", {}, "Body"), body,
      $("div", { cls: "grid2" }, $("div", {}, $("label", {}, "Plan"), $("div", { cls: "sel" }, plan)), $("div", {}, $("label", {}, "Channel"), $("div", { cls: "sel" }, channel))), btn), out);
}

async function run(ticket, post, out, buttons) {
  buttons.forEach(b => b && (b.disabled = true));
  out.replaceChildren($("p", { cls: "muted" }, post ? "Running the pipeline and posting…" : "Running the pipeline (3 triage samples, policy, draft, check)…"));
  try {
    const r = await api(post ? "/api/post" : "/api/decide", { ticket });
    out.replaceChildren(...render(r, ticket.label));
    if (post) { loadStatus(); showTab("tickets"); }
  } catch (err) { out.replaceChildren(card("Error", $("p", { cls: "warn" }, err.message))); }
  buttons.forEach(b => b && (b.disabled = false));
}

function render(r, label) {
  const p = r.payload, kids = [];
  kids.push(card("Decision",
    $("div", { cls: "row" }, $("span", { cls: `badge ${r.action}` }, r.action),
      $("span", { cls: "chip" }, `language ${p.language}`), $("span", { cls: "chip" }, `category ${p.category}`),
      $("span", { cls: "chip" }, `priority ${p.priority}`), $("span", { cls: "chip" }, `confidence ${p.confidence}`),
      $("span", { cls: "chip" }, r.outcome), $("span", { cls: "chip" }, `$${r.cost.toFixed(5)} · ${r.secs}s`),
      r.resumed ? $("span", { cls: "chip" }, "resumed from checkpoint") : null),
    $("p", {}, p.reason),
    r.thread.length ? $("p", { cls: "muted" }, `Read with earlier ticket(s) in the thread: ${r.thread.join(", ")}`) : null));

  if (label) {
    const rows = ["action", "language", "category", "priority"].map(f => {
      const mine = f === "action" ? r.action : p[f], ok = mine === label[f];
      return $("tr", {}, $("td", {}, f), $("td", {}, label[f]), $("td", { cls: ok ? "ok" : "miss" }, `${mine} ${ok ? "✓" : "✗"}`));
    });
    kids.push(card("Compared with Nordavo's label", $("table", { cls: "label-cmp" },
      $("tr", {}, $("th", {}, "field"), $("th", {}, "label"), $("th", {}, "agent")), ...rows),
      $("p", { cls: "muted" }, "Label reason: " + label.reason)));
  }

  kids.push(card("Path through the graph",
    $("div", { cls: "path" }, ...r.nodes.flatMap((n, i) => [i ? $("span", { cls: "muted" }, "→") : null, $("span", { cls: "node" }, n)]))));

  const guard = r.overrides.length
    ? $("ul", {}, ...r.overrides.map(o => $("li", { cls: "warn" }, o)))
    : $("p", { cls: "muted" }, "No guardrail changed the model's decision.");
  const samples = r.samples.length ? $("table", {},
    $("tr", {}, $("th", {}, "#"), $("th", {}, "action"), $("th", {}, "category"), $("th", {}, "priority"), $("th", {}, "faq"), $("th", {}, "rule flags"), $("th", {}, "conf")),
    ...r.samples.map((s, i) => $("tr", {}, $("td", {}, i + 1), $("td", {}, s.action), $("td", {}, s.category), $("td", {}, s.priority),
      $("td", {}, s.faq_ids.join(", ") || "–"),
      $("td", {}, ["refund", "cancellation", "personal_data", "security", "legal", "churn_threat", "injection_attempt"].filter(k => s[k]).join(", ") || "–"),
      $("td", {}, s.confidence)))) : $("p", { cls: "muted" }, "No model call: handled by a code rule.");
  kids.push($("div", { cls: "grid2" }, card("Triage samples (action must be unanimous)", samples), card("Guardrails (code policy)", guard)));

  if (r.draft_reply) {
    const c = r.check || {};
    kids.push($("div", { cls: "grid2" },
      card(`Draft reply (${p.language})`, $("div", { cls: "body" }, r.draft_reply)),
      card("English back-translation (checker)", $("div", { cls: "body" }, c.back_translation_en || "–"))));
    kids.push(card("Reply check",
      c.problems && c.problems.length
        ? $("ul", {}, ...c.problems.map(x => $("li", { cls: "warn" }, x)))
        : $("p", { cls: "ok" }, `Passed: language ${c.reply_language}, every claim supported by the FAQ, no promises, links only to FAQ domains.`)));
  }
  if (p.handoff_note) kids.push(card("Handoff note for the support team (English)", $("div", { cls: "body" }, p.handoff_note)));
  return kids;
}

document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));
loadStatus();
showTab("tickets");
</script>
</body>
</html>
