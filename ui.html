<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roosterly Support Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600;700&family=Public+Sans:wght@400;600;700&display=swap">
<style>
  /* Theme: shadcn preset b2h47HD7kv ("base-sera", mist), tokens copied from `shadcn init -p b2h47HD7kv` */
  :root {
    color-scheme: light dark;
    --background: oklch(1 0 0); --foreground: oklch(0.148 0.004 228.8);
    --card: oklch(1 0 0); --primary: oklch(0.218 0.008 223.9); --primary-foreground: oklch(0.987 0.002 197.1);
    --muted: oklch(0.963 0.002 197.1); --muted-foreground: oklch(0.56 0.021 213.5);
    --border: oklch(0.925 0.005 214.3); --ring: oklch(0.723 0.014 214.4); --sidebar: oklch(0.987 0.002 197.1);
    --destructive: oklch(0.577 0.245 27.325); --radius: 0.625rem;
    --reply: oklch(0.52 0.13 150); --handoff: oklch(0.6 0.16 50); --close: var(--muted-foreground);
    --font-serif: "Noto Serif", serif; --font-heading: "Public Sans", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --bg: var(--background); --panel: var(--card); --text: var(--foreground); --line: var(--border);
    --accent: var(--primary); --chip: var(--muted); --warn: var(--destructive);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: oklch(0.148 0.004 228.8); --foreground: oklch(0.987 0.002 197.1);
      --card: oklch(0.218 0.008 223.9); --primary: oklch(0.925 0.005 214.3); --primary-foreground: oklch(0.218 0.008 223.9);
      --muted: oklch(0.275 0.011 216.9); --muted-foreground: oklch(0.723 0.014 214.4);
      --border: oklch(1 0 0 / 10%); --ring: oklch(0.56 0.021 213.5); --sidebar: oklch(0.218 0.008 223.9);
      --destructive: oklch(0.704 0.191 22.216);
      --reply: oklch(0.72 0.15 150); --handoff: oklch(0.75 0.15 55);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; font: 15px/1.65 var(--font-serif); background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
  h1, h2, h3, .kicker, .badge, .chip, button, label, th, .stat, nav, .node, .tile b, .bar-row, .tabs { font-family: var(--font-heading); }
  header { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; padding: 12px 22px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header .brand { font-weight: 700; font-family: var(--font-heading); font-size: 15px; margin-right: 8px; }
  .stat { color: var(--muted-foreground); font-size: 13px; }
  .stat b { color: var(--text); }
  .progress { height: 2px; background: var(--line); }
  .progress div { height: 100%; background: var(--accent); transition: width .3s; }
  .shell { flex: 1; display: grid; grid-template-columns: 250px 1fr; min-height: 0; }
  nav { border-right: 1px solid var(--line); background: var(--sidebar); padding: 18px 0; overflow: auto; }
  nav a { display: flex; gap: 12px; align-items: baseline; padding: 9px 22px; color: var(--muted-foreground); text-decoration: none; font-size: 13px; font-weight: 600; border-left: 2px solid transparent; }
  nav a span { font-size: 11px; letter-spacing: .1em; opacity: .7; }
  nav a:hover { color: var(--text); }
  nav a.on { color: var(--text); border-left-color: var(--accent); background: var(--chip); }
  nav .hint { padding: 18px 22px; font-size: 12px; color: var(--muted-foreground); font-family: var(--font-serif); }
  main { overflow: auto; min-height: 0; }
  .stage { max-width: 1120px; margin: 0 auto; padding: 34px 34px 20px; }
  .kicker { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted-foreground); }
  h1 { font-size: 30px; line-height: 1.2; margin: 6px 0 10px; letter-spacing: -.01em; }
  .lead { font-size: 17px; color: var(--muted-foreground); max-width: 760px; margin: 0 0 26px; }
  h3 { font-size: 13px; margin: 0 0 8px; letter-spacing: .02em; }
  .pager { display: flex; justify-content: space-between; gap: 12px; padding: 14px 34px; border-top: 1px solid var(--line); background: var(--panel); }
  @media (max-width: 900px) { .shell { grid-template-columns: 1fr; } nav { display: none; } .stage { padding: 22px 16px; } .pager { padding: 12px 16px; } }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px; }
  .card > h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--muted-foreground); margin: 0 0 12px; }
  .grid2, .grid3, .grid4 { display: grid; gap: 16px; }
  .grid2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .grid2 > .card, .grid3 > .card, .grid4 > .card { margin-bottom: 0; }
  .stack > * + * { margin-top: 16px; }
  @media (max-width: 1000px) { .grid2, .grid3, .grid4 { grid-template-columns: 1fr; } }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
  .tile b { display: block; font-size: 30px; line-height: 1.1; }
  .tile span { color: var(--muted-foreground); font-size: 13px; }
  .callout { border-left: 3px solid var(--accent); padding: 10px 16px; background: var(--chip); margin: 0 0 18px; }
  .callout.bad { border-color: var(--warn); } .callout.good { border-color: var(--reply); }
  p { margin: 0 0 10px; } ul { margin: 0; padding-left: 20px; } li + li { margin-top: 4px; }
  .muted { color: var(--muted-foreground); } .warn { color: var(--warn); } .ok { color: var(--reply); } .miss { color: var(--warn); }
  .body { white-space: pre-wrap; }
  code, pre, .mono { font-family: var(--mono); font-size: 12.5px; }
  code { background: var(--chip); padding: 1px 5px; border-radius: 4px; }
  pre { margin: 0; padding: 14px; background: var(--bg); border: 1px solid var(--line); border-radius: calc(var(--radius) * .6); overflow: auto; max-height: 460px; line-height: 1.5; }
  pre .ln { color: var(--muted-foreground); user-select: none; display: inline-block; width: 3.2em; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip { background: var(--chip); border-radius: calc(var(--radius) * .6); padding: 2px 10px; font-size: 12px; white-space: nowrap; }
  .badge { display: inline-block; padding: 3px 10px; font-weight: 600; letter-spacing: .1em; color: var(--primary-foreground); text-transform: uppercase; font-size: 11px; }
  .reply { background: var(--reply); } .handoff { background: var(--handoff); } .close { background: var(--close); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

  button { height: 38px; padding: 0 18px; border-radius: 0; border: 1px solid var(--line); background: transparent; color: var(--text); cursor: pointer; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
  button:hover { background: var(--muted); }
  button:focus-visible, nav a:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
  button.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
  button.primary:hover { background: color-mix(in oklch, var(--primary) 80%, transparent); }
  button.small { height: 28px; padding: 0 10px; font-size: 10.5px; }
  button.on { background: var(--chip); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: wait; }

  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  td, th { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-foreground); font-weight: 600; }
  tr.click { cursor: pointer; } tr.click:hover td { background: var(--chip); }
  input, textarea, select { width: 100%; font: inherit; padding: 8px 10px; border-radius: 0; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--ring); outline-offset: -1px; }
  textarea { min-height: 110px; }
  select { appearance: none; -webkit-appearance: none; cursor: pointer; padding-right: 32px; height: 38px; }
  .sel { position: relative; }
  .sel::after { content: ""; position: absolute; right: 12px; top: 50%; width: 6px; height: 6px; margin-top: -5px; border-right: 1.5px solid var(--muted-foreground); border-bottom: 1.5px solid var(--muted-foreground); transform: rotate(45deg); pointer-events: none; }
  select option { background: var(--panel); color: var(--text); }
  label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted-foreground); margin: 10px 0 4px; }

  /* pipeline diagram */
  .flow { display: flex; align-items: stretch; gap: 0; overflow-x: auto; padding: 4px 2px 8px; }
  .node { flex: 1 0 112px; border: 1px solid var(--line); background: var(--panel); padding: 12px 12px 10px; cursor: pointer; text-align: left; height: auto; letter-spacing: 0; text-transform: none; font-size: 13px; transition: border-color .2s, background .2s, opacity .3s; border-radius: 0; }
  .node small { display: block; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted-foreground); margin-top: 4px; font-weight: 600; }
  .node.llm small { color: var(--handoff); }
  .node.sel-node { border-color: var(--accent); background: var(--chip); }
  .flow.trace .node { opacity: .35; }
  .flow.trace .node.lit { opacity: 1; border-color: var(--reply); }
  .arrow { flex: 0 0 22px; align-self: center; text-align: center; color: var(--muted-foreground); font-family: var(--font-heading); }
  .branches { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; margin-top: 10px; font-size: 13px; }
  @media (max-width: 1000px) { .branches { grid-template-columns: 1fr; } }

  /* eval bars */
  .bar-row { display: grid; grid-template-columns: 170px 1fr; gap: 14px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .bar-row:last-child { border-bottom: 0; }
  .bars { display: grid; gap: 4px; }
  .bar { display: grid; grid-template-columns: 80px 1fr 56px; gap: 10px; align-items: center; font-size: 12px; }
  .bar .track { height: 12px; background: var(--chip); }
  .bar .fill { height: 100%; background: var(--muted-foreground); transition: width .6s; }
  .bar.final .fill { background: var(--accent); }
  .bar .v { text-align: right; font-variant-numeric: tabular-nums; }
  .legend { font-size: 12px; color: var(--muted-foreground); }

  /* live console */
  .console { display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 1000px) { .console { grid-template-columns: 1fr; } }
  .list { border: 1px solid var(--line); background: var(--panel); max-height: 640px; overflow: auto; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
  .tabs button { flex: 1; border: 0; border-bottom: 2px solid transparent; height: 40px; padding: 0 4px; color: var(--muted-foreground); font-size: 11px; }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); background: transparent; }
  .item { padding: 9px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:hover, .item.on { background: var(--chip); }
  .item .top { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--muted-foreground); font-family: var(--font-heading); }
  .item .subj { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
  .cmd { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); background: var(--bg); padding: 8px 8px 8px 14px; margin-bottom: 8px; }
  .cmd code { flex: 1; background: none; padding: 0; overflow-x: auto; white-space: nowrap; }
  .cmd .what { color: var(--muted-foreground); font-size: 13px; min-width: 0; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s 0.8s linear infinite; vertical-align: -1px; margin-right: 8px; }
  @keyframes s { to { transform: rotate(360deg); } }
  dialog { width: min(860px, calc(100vw - 32px)); max-height: calc(100vh - 64px); padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--text); }
  dialog::backdrop { background: oklch(0 0 0 / 55%); }
  dialog .dhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
  dialog .dbody { padding: 18px 20px; }
  dialog { width: min(980px, calc(100vw - 32px)); }
  .msec { padding: 18px 0; border-bottom: 1px solid var(--line); }
  .msec:first-child { padding-top: 0; } .msec:last-child { border-bottom: 0; padding-bottom: 0; }
  .pane { border: 1px solid var(--line); background: var(--bg); padding: 14px 16px; border-radius: calc(var(--radius) * .6); }
  .plabel { font-family: var(--font-heading); font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted-foreground); margin-bottom: 8px; }
  .kvgrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border: 1px solid var(--line); }
  .kv { padding: 10px 12px; border-right: 1px solid var(--line); }
  .kv:last-child { border-right: 0; }
  .kv span { display: block; font-family: var(--font-heading); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted-foreground); }
  .kv b { font-family: var(--font-heading); font-size: 15px; }
  @media (max-width: 760px) { .kvgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kv { border-bottom: 1px solid var(--line); } }
  table.how td:first-child { width: 160px; color: var(--muted-foreground); font-family: var(--font-heading); font-size: 12px; letter-spacing: .04em; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header>
  <span class="brand">Roosterly support agent</span>
  <span class="stat" id="model"></span>
  <span class="stat" id="hd"></span>
</header>
<div class="progress"><div id="prog"></div></div>
<div class="shell">
  <nav id="nav"></nav>
  <main id="main"><div class="stage" id="stage"></div></main>
</div>
<div class="pager"><button id="back">← Back</button><button id="next" class="primary">Next →</button></div>

<script>
// ---------- helpers (all text is inserted as text nodes: ticket content can never inject HTML)
const $ = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "on") for (const [ev, fn] of Object.entries(v)) el.addEventListener(ev, fn);
    else if (k === "cls") el.className = v;
    else if (v != null && v !== false) el.setAttribute(k, v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return el;
};
const api = async (path, body) => {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : { cache: "no-store" });
  const data = await r.json();
  if (!r.ok || data.error) throw new Error(data.error || r.statusText);
  return data;
};
const memo = {};
const get = path => (memo[path] ??= api(path).catch(e => { delete memo[path]; throw e; }));
const card = (title, ...kids) => $("div", { cls: "card" }, title ? $("h2", {}, title) : null, ...kids);
const tile = (big, small) => $("div", { cls: "tile" }, $("b", {}, big), $("span", {}, small));
const badge = a => $("span", { cls: `badge ${a}` }, a);
const pct = v => `${Math.round(v * 100)}%`;
const handledAction = h => (typeof h === "string" ? h : h && h.action);
const loading = msg => $("p", { cls: "muted" }, $("span", { cls: "spin" }), msg || "Loading…");
const fail = err => $("p", { cls: "warn" }, err.message || String(err));
function later(el, promise, render) {  // fill `el` when data arrives
  el.replaceChildren(loading());
  promise.then(d => el.replaceChildren(...[render(d)].flat())).catch(e => el.replaceChildren(fail(e)));
  return el;
}
function codeView(name) {
  const box = $("div");
  return later(box, get(`/api/code/${name}`), c => [
    $("div", { cls: "row", style: "margin-bottom:6px" }, $("span", { cls: "chip mono" }, `${c.file}:${c.line}`), $("span", { cls: "muted mono" }, c.name)),
    $("pre", {}, c.source.replace(/\n$/, "").split("\n").map((l, i) => [$("span", { cls: "ln" }, c.line + i), l, "\n"]))]);
}

// ---------- the pipeline
const NODES = [
  { id: "fetch", name: "Fetch & redact", kind: "code", code: ["redact", "thread_for"],
    what: ["GET /tickets?status=all, page by page, and keep the open ones.",
           "Card numbers (Luhn-checked), IBANs (mod-97), CVCs and expiry dates are replaced before the text enters the graph.",
           "A 'Re:' subject pulls earlier tickets of the same thread in as context."],
    why: "The model, the checkpoint database and the logs never see payment details, so they cannot leak them." },
  { id: "prepare", name: "Prepare", kind: "code", code: ["prepare"],
    what: ["Strips Re:/Fwd: prefixes and detects an empty ticket (no subject, no body).", "An empty ticket skips the model and is closed by the policy."],
    why: "No model call for something code can decide for certain." },
  { id: "triage", name: "Triage ×3", kind: "model", code: ["triage", "Triage", "TRIAGE_SYSTEM", "UNTRUSTED"],
    what: ["The same structured question is asked 3 times in parallel at temperature 0.8.",
           "Each sample returns language, category, priority, action, six client-rule flags, an injection flag, the FAQ sections that answer it, a reason and an English handoff note.",
           "Output is forced into a strict JSON schema; the ticket is wrapped in <ticket> tags as data."],
    why: "If three samples do not agree on the action, the model is unsure. That is a measured signal, unlike a self-reported confidence." },
  { id: "policy", name: "Vote + policy", kind: "code", code: ["policy", "vote"],
    what: ["Majority vote per field; a rule flag from any one sample counts.",
           "Plain code then applies the client's rules: rule flag or keyword hit, P1, disagreement, no FAQ source, low confidence → handoff.",
           "Money, contract, data or risk is at least P2."],
    why: "The model judges, code decides. The policy can only move a ticket towards a human, never away from one." },
  { id: "draft", name: "Draft", kind: "model", code: ["draft", "DRAFT_SYSTEM"],
    what: ["Only for replies. The model sees only the FAQ sections the triage cited, plus the ticket.",
           "Writes in the customer's language (Dutch 'je', German 'Sie'), keeping the Dutch menu names customers see."],
    why: "Grounding on the cited sections only: the reply cannot draw on anything outside the help centre." },
  { id: "verify", name: "Verify", kind: "model + code", code: ["verify", "Check", "CHECK_SYSTEM", "reply_problems"],
    what: ["A separate checker back-translates the draft to English, identifies its language, lists unsupported claims and promises, and says whether it answers the question.",
           "Code adds a deterministic filter: links only to domains the FAQ names, no email addresses, no payment details.",
           "Any problem turns the reply into a handoff."],
    why: "This is how a Dutch reply is checked without reading Dutch, and the English version is logged for review." },
  { id: "post", name: "Post", kind: "code", code: ["decide", "payload", "call"],
    what: ["Builds the decision body and redacts it once more.",
           "Re-reads the ticket first: if it is already handled, nothing is sent. A 409 counts as done.",
           "Throttled to 4 calls/s; 429 waits Retry-After, 503 retries with backoff."],
    why: "Exactly one answer per customer, even after a crash or a retry." },
];

function flow(onPick, selected) {
  const el = $("div", { cls: "flow" });
  NODES.forEach((n, i) => {
    if (i) el.append($("div", { cls: "arrow" }, "→"));
    el.append($("button", { cls: `node ${n.kind.includes("model") ? "llm" : ""} ${n.id === selected ? "sel-node" : ""}`, "data-node": n.id,
      on: { click: () => onPick && onPick(n.id) } }, n.name, $("small", {}, n.kind)));
  });
  return el;
}
async function lightUp(flowEl, ran) {
  flowEl.classList.add("trace");
  flowEl.querySelectorAll(".node").forEach(n => n.classList.remove("lit"));
  for (const id of ["fetch", ...ran]) {
    const n = flowEl.querySelector(`[data-node="${id}"]`);
    if (n) { n.classList.add("lit"); await new Promise(r => setTimeout(r, 220)); }
  }
}

// ---------- chapters
const CHAPTERS = [
  { title: "The problem", render: chProblem },
  { title: "How it works", render: chPipeline },
  { title: "Safety", render: chSafety },
  { title: "Dutch", render: chDutch },
  { title: "Reliability", render: chReliability },
  { title: "Evals", render: chEvals },
  { title: "Live demo", render: chLive },
  { title: "Run it", render: chRun },
];
const head = (kicker, title, lead) => [$("div", { cls: "kicker" }, kicker), $("h1", {}, title), lead ? $("p", { cls: "lead" }, lead) : null];

function chProblem() {
  const tiles = $("div", { cls: "grid4", style: "margin-bottom:16px" });
  later(tiles, Promise.all([get("/api/status"), get("/api/config"), get("/api/examples")]), ([s, c, ex]) => [
    tile(s.open_tickets + s.handled_tickets, "tickets in the helpdesk"), tile(ex.length, "labelled examples for the eval"),
    tile(Object.keys(c.faq).length, "help-centre sections (the only knowledge)"), tile(Object.keys(c.rules).length, "client rules that always go to a human")]);
  const actions = $("div", { cls: "grid3" });
  later(actions, get("/api/log"), log => {
    const n = a => log.tickets.filter(t => t.action === a).length;
    return [["reply", "A draft in the customer's language, built only from the FAQ."],
            ["handoff", "To a human, with an English note they can act on in under a minute."],
            ["close", "Spam or an empty ticket."]].map(([a, d]) =>
      card(null, $("div", { cls: "row", style: "justify-content:space-between" }, badge(a), $("span", { cls: "muted" }, `${n(a)} in the latest run`)), $("p", { style: "margin:10px 0 0" }, d)));
  });

      r.resumed ? $("span", { cls: "chip" }, "resumed from checkpoint") : null),
    $("p", { style: "margin-top:10px" }, p.reason),
    r.thread.length ? $("p", { cls: "muted" }, `Read with earlier ticket(s) in the thread: ${r.thread.join(", ")}`) : null));
  if (label) kids.push(card("Compared with Nordavo's label", $("table", {},
    $("tr", {}, $("th", {}, "field"), $("th", {}, "label"), $("th", {}, "agent")),
    ["action", "language", "category", "priority"].map(f => {
      const mine = f === "action" ? r.action : p[f], ok = mine === label[f];
      return $("tr", {}, $("td", {}, f), $("td", {}, label[f]), $("td", { cls: ok ? "ok" : "miss" }, `${mine} ${ok ? "✓" : "✗"}`));
    })), $("p", { cls: "muted", style: "margin-top:8px" }, "Label reason: " + label.reason)));
  const flags = ["refund", "cancellation", "personal_data", "security", "legal", "churn_threat", "injection_attempt"];
  const samples = r.samples.length ? $("table", {},
    $("tr", {}, $("th", {}, "#"), $("th", {}, "action"), $("th", {}, "category"), $("th", {}, "priority"), $("th", {}, "faq"), $("th", {}, "flags"), $("th", {}, "conf")),
    r.samples.map((s, i) => $("tr", {}, $("td", {}, i + 1), $("td", {}, s.action), $("td", {}, s.category), $("td", {}, s.priority),
      $("td", {}, s.faq_ids.join(", ") || "–"), $("td", {}, flags.filter(k => s[k]).join(", ") || "–"), $("td", {}, s.confidence))))
    : $("p", { cls: "muted" }, "No model call: decided by a code rule.");
  kids.push($("div", { cls: "grid2", style: "margin-bottom:16px" }, card("Triage samples: the action must be unanimous", samples),
    card("Guardrails (code policy)", r.overrides.length ? $("ul", {}, r.overrides.map(o => $("li", { cls: "warn mono" }, o))) : $("p", { cls: "muted" }, "None fired: the model's decision stood."))));
  if (r.draft_reply) {
    const c = r.check || {};
    kids.push($("div", { cls: "grid2", style: "margin-bottom:16px" }, card(`Draft reply (${p.language})`, $("div", { cls: "body" }, r.draft_reply)),
      card("English back-translation (checker)", $("div", { cls: "body" }, c.back_translation_en || "–"))));
    kids.push(card("Reply check", c.problems && c.problems.length ? $("ul", {}, c.problems.map(x => $("li", { cls: "warn" }, x)))
      : $("p", { cls: "ok" }, `Passed: language ${c.reply_language}, every claim supported by the FAQ, no promises, links only to FAQ domains.`)));
  }
  if (p.handoff_note) kids.push(card("Handoff note for the support team (English)", $("div", { cls: "body" }, p.handoff_note)));
  return kids;
}

function chRun() {
  const cmd = (c, what) => $("div", { cls: "cmd" }, $("div", { style: "flex:1;min-width:0" }, $("code", {}, c), $("div", { cls: "what" }, what)),
    $("button", { cls: "small", on: { click: e => navigator.clipboard.writeText(c).then(() => { e.target.textContent = "copied"; setTimeout(() => e.target.textContent = "copy", 1200); }) } }, "copy"));
  const log = $("div");
  const fillLog = () => later(log, get("/api/log"), logView);
  const refreshLog = () => { delete memo["/api/log"]; get("/api/log").then(l => log.replaceChildren(...logView(l))).catch(() => {}); };
  const runner = runPanel(() => { ["/api/tickets", "/api/status"].forEach(k => delete memo[k]); refreshLog(); loadStatus(); }, refreshLog);
  const logView = l => {
    const counts = {};
    l.tickets.forEach(t => counts[t.action] = (counts[t.action] || 0) + 1);
    return [$("div", { cls: "row", style: "margin-bottom:12px" }, Object.entries(counts).map(([a, n]) => [badge(a), $("span", { style: "margin-right:12px" }, ` ${n}`)]),
        $("span", { cls: "muted" }, `${l.lines} log lines over ${l.runs.length} run(s), $${l.runs.reduce((s, r) => s + r.cost, 0).toFixed(4)} total`)),
      $("table", {}, $("tr", {}, $("th", {}, "ticket"), $("th", {}, "action"), $("th", {}, "lang"), $("th", {}, "category"), $("th", {}, "prio"), $("th", {}, "status"), $("th", {}, "guardrails"), $("th", {}, "details")),
        l.tickets.map(t => $("tr", {}, $("td", {}, $("b", {}, t.ticket)), $("td", {}, t.action ? badge(t.action) : "–"), $("td", {}, t.language || "–"), $("td", {}, t.category || "–"),
          $("td", {}, t.priority || "–"), $("td", { cls: t.outcome === "error" ? "warn" : "" }, t.outcome), $("td", { cls: "mono", style: "font-size:11.5px" }, (t.overrides || []).join(", ") || "–"),
          $("td", {}, $("button", { cls: "small", on: { click: () => outcomeModal(t) } }, "View")))))];
  };
  fillLog();
  return [...head("Chapter 8", "Run it yourself",
    "Python 3.12+ and uv. Keys go in .env (git-ignored); .env.example lists them. Re-running is always safe."),
    card("From a fresh clone",
      cmd("uv sync && cp .env.example .env", "install, then fill HELPDESK_KEY, CANDIDATE_EMAIL, OPENROUTER_API_KEY"),
      cmd("uv run python safety.py && uv run python test_reliability.py", "offline checks, no network"),
      cmd("uv run eval.py --tag mine --runs 3", "eval on the 10 labelled examples, posts nothing"),
      cmd("uv run agent.py --dry-run", "decide every open ticket and print, post nothing"),
      cmd("uv run agent.py --reset", "the clean run: reset the practice set, then handle all 30 once"),
      cmd("uv run ui.py", "this walkthrough at http://127.0.0.1:8000")),
    runner,
    card("Latest decision per ticket (logs/agent.jsonl)", log),
    card("What I would do next", $("ul", {},
      $("li", {}, "Start with drafts that a person approves before they are sent (a LangGraph interrupt before post). Then allow auto-send one category at a time, with a kill switch."),
      $("li", {}, "Keep customer data in the EU, as FAQ F09 promises: an EU endpoint with zero data retention, a DPIA and limits on how long logs are kept."),
      $("li", {}, "Tell customers when a reply was written by AI, as article 50 of the EU AI Act requires."),
      $("li", {}, "Have the support team label about 100 real tickets, add a set of adversarial tickets, and run the eval in CI. Priority is the field the agent gets wrong most often."),
      $("li", {}, "Change one client rule: define what counts as a contract change. Read literally, it includes upgrading, which F05 tells customers to do themselves.")))];
}

// one logged decision, in full (all text inserted as text nodes)
function outcomeModal(t) {
  const d = $("dialog");
  const close = () => d.close();
  d.addEventListener("click", e => { if (e.target === d) close(); });  // click on the backdrop
  d.addEventListener("close", () => d.remove());
  const section = (title, ...kids) => $("section", { cls: "msec" }, $("div", { cls: "kicker", style: "margin-bottom:10px" }, title), ...kids);
  const kv = (k, v) => $("div", { cls: "kv" }, $("span", {}, k), $("b", {}, v ?? "–"));
  const when = iso => { try { return new Date(iso).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }); } catch { return iso; } };

  const head = $("div", { cls: "row", style: "min-width:0" }, $("b", { style: "font-size:18px;font-family:var(--font-heading)" }, t.ticket),
    t.action ? badge(t.action) : null, $("span", { cls: `chip ${t.outcome === "error" ? "warn" : ""}` }, t.outcome));
  const subject = $("span", { cls: "muted", style: "overflow:hidden;text-overflow:ellipsis;white-space:nowrap" });

  // 1. the ticket, original and English
  const ticketBox = $("div");
  later(ticketBox, get("/api/tickets"), all => {
    const tk = all.find(x => x.id === t.ticket);
    if (!tk) return $("p", { cls: "muted" }, "Ticket not found in the helpdesk.");
    subject.textContent = tk.subject || "";
    const en = $("div");
    const isEn = t.language === "en";
    if (!isEn) later(en, api("/api/translate", { id: tk.id }), tr => [
      $("div", { style: "font-weight:600;margin-bottom:6px" }, tr.subject_en || "(no subject)"), $("div", { cls: "body" }, tr.body_en || "(empty body)")]);
    return [
      $("div", { cls: "row", style: "margin-bottom:12px" }, [`${tk.channel}`, `plan ${tk.customer_plan}`, `received ${when(tk.received_at)}`,
        `helpdesk: ${tk.handled ? `handled · ${handledAction(tk.handled)}` : "open"}`].map(c => $("span", { cls: "chip" }, c))),
      $("div", { cls: isEn ? "" : "grid2" },
        $("div", { cls: "pane" }, $("div", { cls: "plabel" }, `Customer wrote${t.language ? ` (${t.language})` : ""}`),
          $("div", { style: "font-weight:600;margin-bottom:6px" }, tk.subject || "(no subject)"), $("div", { cls: "body" }, tk.body || "(empty body)")),
        isEn ? null : $("div", { cls: "pane" }, $("div", { cls: "plabel" }, "English translation"), en,
          $("div", { cls: "muted", style: "font-size:12px;margin-top:10px" }, "For reading only. The agent works on the original text."))),
      $("p", { cls: "muted", style: "font-size:12px;margin:8px 0 0" }, "Payment details are redacted before the agent sees the ticket.")];
  });

  // 2. the decision
  const decision = t.error ? $("div", { cls: "callout bad", style: "margin:0" }, $("b", {}, "Error: "), t.error, " Nothing was posted; the ticket stays open for the next run.")
    : [$("div", { cls: "kvgrid" }, kv("Action", t.action), kv("Language", t.language), kv("Category", t.category), kv("Priority", t.priority),
        kv("Confidence", t.confidence), kv("FAQ cited", t.faq && t.faq.length ? t.faq.join(", ") : "none")),
       t.reason ? $("p", { style: "margin:14px 0 0" }, t.reason) : null];

  // 3. what the customer or the support team got
  let sent = null;
  if (t.reply) sent = section("Reply sent to the customer", $("div", { cls: "grid2" },
    $("div", { cls: "pane" }, $("div", { cls: "plabel" }, `Reply (${t.language})`), $("div", { cls: "body" }, t.reply)),
    $("div", { cls: "pane" }, $("div", { cls: "plabel" }, "Checker's English back-translation"), $("div", { cls: "body" }, t.reply_en || "–"))));
  else if (t.handoff_note) sent = section("Handoff note for the support team", $("div", { cls: "pane" }, $("div", { cls: "body" }, t.handoff_note)));
  else if (t.action === "close") sent = section("Closed", $("p", { cls: "muted" }, "Spam or empty: nothing is sent to the customer."));

  // 4. how it was decided
  const samples = t.sample_actions || [];
  const howRows = t.error ? [] : [
    ["Triage samples", samples.length ? $("div", { cls: "row" }, samples.map(badge),
      $("span", { cls: "muted" }, new Set(samples).size === 1 ? "unanimous" : "disagree → handoff")) : "none: decided by a code rule"],
    ["Guardrails", t.overrides && t.overrides.length ? $("div", { cls: "row" }, t.overrides.map(o => $("span", { cls: "chip warn mono" }, o)))
      : $("span", { cls: "muted" }, "none fired: the model's decision stood")],
    ["Checkpoint", t.resumed ? "resumed after an interrupted earlier run" : "fresh run"],
    ["Cost and time", `$${(t.cost_usd || 0).toFixed(5)} · ${t.secs}s`]];
  howRows.push(["Run", $("span", { cls: "mono" }, `${t.run} · ${when(t.ts)}`)]);

  d.append(
    $("div", { cls: "dhead" }, $("div", { style: "display:flex;flex-direction:column;gap:4px;min-width:0" }, head, subject),
      $("button", { cls: "small", on: { click: close } }, "Close")),
    $("div", { cls: "dbody" },
      section("Customer ticket", ticketBox),
      section("Decision", decision),
      sent,
      section("How it was decided", $("table", { cls: "how" }, howRows.map(([k, v]) => $("tr", {}, $("td", {}, k), $("td", {}, v)))))));
  document.body.append(d);
  d.showModal();
}

// "Run all": starts agent.py on the server and follows its output
function runPanel(onDone, onProgress) {
  const out = $("pre", { style: "margin-top:14px;max-height:360px", hidden: "" });
  const bar = $("div", { cls: "fill", style: "width:0%" }), progress = $("div", { cls: "bar final", style: "grid-template-columns:1fr 90px;margin-top:14px", hidden: "" },
    $("div", { cls: "track" }, bar), $("span", { cls: "v" }));
  const state = $("p", { cls: "muted", style: "margin-top:10px" });
  const modes = [
    ["dry", "Dry run all", "decides every open ticket, posts nothing", null],
    ["open", "Run open tickets", "decides and posts every ticket that is still open", "Post a decision for every open ticket? Each customer gets at most one answer."],
    ["reset", "Reset & run all 30", "the final run: POST /practice/reset, then decide and post all 30 once", "Reset the practice set and post decisions for all 30 tickets? This becomes the run Nordavo scores."],
  ];
  const buttons = modes.map(([m, label, , ask]) => $("button", { cls: m === "reset" ? "primary" : "", on: { click: () => start(m, ask) } }, label));
  let timer = null, lastDone = -1, watching = false;
  function show(r) {
    const head = r.lines.find(l => / open of \d+ tickets/.test(l));
    const total = head ? +head.match(/: (\d+) open/)[1] : 0;
    const done = r.lines.filter(l => /^T\d+\s/.test(l)).length;
    out.hidden = progress.hidden = !r.lines.length && !r.running;
    out.textContent = r.lines.join("\n") || "starting…";
    out.scrollTop = out.scrollHeight;
    bar.style.width = total ? `${done / total * 100}%` : "0%";
    progress.lastChild.textContent = total ? `${done} / ${total}` : "";
    buttons.forEach(b => b.disabled = r.running);
    state.replaceChildren(...(r.running ? [$("span", { cls: "spin" }), `Running (${r.mode})… ${done}${total ? ` of ${total}` : ""} tickets done`]
      : r.exit == null ? [] : [$("span", { cls: r.exit === 0 ? "ok" : "warn" }, r.exit === 0 ? `Finished (${r.mode}), no errors.` : `Finished with errors (exit ${r.exit}). Failed tickets stay open; run again to retry them.`),
        " Pick a button above to start another run. ", $("button", { cls: "small", on: { click: () => { out.hidden = progress.hidden = true; state.replaceChildren(); } } }, "Clear output")]));
    return done;
  }
  async function poll() {
    if (!document.body.contains(out)) { clearInterval(timer); timer = null; return; }  // left the chapter
    try {
      const r = await api("/api/run");
      const done = show(r);
      if (r.running) watching = true;
      if (done !== lastDone && r.mode !== "dry") { lastDone = done; onProgress(); }  // log table follows the run
      if (!r.running) {
        clearInterval(timer); timer = null;
        if (watching) { watching = false; onDone(); }
      }
    } catch (e) { state.replaceChildren(fail(e)); }
  }
  const follow = () => { if (!timer) timer = setInterval(poll, 1000); poll(); };
  async function start(mode, ask) {
    if (ask && !confirm(ask)) return;
    try { show(await api("/api/run", { mode })); watching = true; lastDone = -1; follow(); }
    catch (e) { state.replaceChildren(fail(e)); }
  }
  setTimeout(follow, 0);  // once the panel is on the page: pick up a run already in progress (e.g. after a refresh)
  return card("Run all tickets from here",
    $("p", { cls: "muted" }, "Runs ", $("code", {}, "agent.py"), " on the server, exactly like the command line, and streams its output. Same safeguards: a ticket that is already handled is never posted again."),
    $("div", { cls: "row" }, buttons),
    $("ul", { cls: "muted", style: "margin-top:10px;font-size:13px" }, modes.map(([, label, what]) => $("li", {}, $("b", {}, label), ": ", what))),
    progress, state, out);
}

// ---------- shell
let current = 0;
function go(i) {
  current = Math.max(0, Math.min(CHAPTERS.length - 1, i));
  history.replaceState(null, "", `#${current + 1}`);
  document.querySelectorAll("nav a").forEach((a, j) => a.classList.toggle("on", j === current));
  document.getElementById("prog").style.width = `${(current + 1) / CHAPTERS.length * 100}%`;
  document.getElementById("stage").replaceChildren(...CHAPTERS[current].render());
  document.getElementById("main").scrollTop = 0;
  document.getElementById("back").disabled = current === 0;
  const next = document.getElementById("next");
  next.disabled = current === CHAPTERS.length - 1;
  next.textContent = current < CHAPTERS.length - 1 ? `${CHAPTERS[current + 1].title} →` : "Done";
}
async function loadStatus() {
  try {
    const s = await get("/api/status");
    document.getElementById("model").replaceChildren("Model ", $("b", {}, s.model));
    document.getElementById("hd").replaceChildren("Helpdesk ", $("b", {}, `${s.open_tickets} open · ${s.handled_tickets} handled`), ` (${s.mode})`);
  } catch (e) { document.getElementById("hd").textContent = "Helpdesk unreachable: " + e.message; }
}
document.getElementById("nav").append(...CHAPTERS.map((c, i) => $("a", { href: `#${i + 1}`, on: { click: e => { e.preventDefault(); go(i); } } }, $("span", {}, String(i + 1).padStart(2, "0")), c.title)),
  $("div", { cls: "hint" }, "← → to move between chapters"));
document.getElementById("back").onclick = () => go(current - 1);
document.getElementById("next").onclick = () => go(current + 1);
document.addEventListener("keydown", e => {
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "ArrowRight") go(current + 1);
  if (e.key === "ArrowLeft") go(current - 1);
});
loadStatus();
go((parseInt(location.hash.slice(1)) || 1) - 1);
</script>
